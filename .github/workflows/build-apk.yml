name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Extraire le code (zip le plus récent)
        run: |
          ZIP=$(ls iptv-player*.zip | sort -V | tail -1)
          echo "Zip utilisé : $ZIP"
          rm -rf code && unzip -o -q "$ZIP" -d code

      - name: Construire l'APK
        run: bash code/iptv-player/scripts/build.sh

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Version ${{ github.run_number }}
          files: build-app/android/app/build/outputs/apk/release/app-release.apk
